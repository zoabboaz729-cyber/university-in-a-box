{% extends "auth_base.html" %}
{% block title %}Sign in — University in a Box{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Sign in</h1>
  <p class="subtitle">Open your reading room.</p>
</div>

{% if error %}
<div class="callout callout-error"><strong>Error:</strong> {{ error }}</div>
{% endif %}

<form method="post" action="/login" class="auth-form">
  <input type="hidden" name="next" value="{{ next_url }}">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}"
           autocomplete="email" required>
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Sign in</button>
  </div>
</form>

<p class="form-hint">
  No account yet?
  <a href="/register{% if next_url and next_url != '/' %}?next={{ next_url }}{% endif %}">Create one</a>.
</p>
{% endblock %}
