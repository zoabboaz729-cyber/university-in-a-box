{% extends "base.html" %}
{% block title %}New course — University in a Box{% endblock %}

{% block content %}
<a class="back-link" href="/">Dashboard</a>

<div class="page-head">
  <h1>What do you want to learn?</h1>
  <p class="subtitle">The Advisor will interview you in five steps, then build a curriculum with you.</p>
</div>

<div class="card" style="max-width:600px">
  <form method="post" action="/advisor/new">
    <div class="form-group">
      <label for="topic">Topic</label>
      <input id="topic" name="topic" type="text" autofocus required
             placeholder="e.g. Business finance fundamentals, Design theory, Applied statistics">
    </div>
    <button class="btn btn-primary" type="submit">Start interview →</button>
  </form>
</div>
{% endblock %}
